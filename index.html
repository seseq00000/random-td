<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>랜덤 타워디펜스</title>
    <!--
      iOS 사파리는 전체화면 API 를 임의 요소에 안 열어준다(비디오만 된다).
      대신 **홈 화면에 추가**하면 주소창 없이 뜬다 — 그 경로를 열어두는 설정이다.
      안드로이드 크롬은 전체화면 버튼이 그냥 동작하므로 둘 다 커버된다.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="랜덤TD" />
    <meta name="theme-color" content="#101318" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <!-- 입장 화면 — 닉네임을 받기 전에는 게임을 시작하지 않는다 -->
    <div id="gate" class="overlay">
      <div class="dialog">
        <h1>랜덤 타워디펜스</h1>
        <p class="sub">뽑기의 운을 조합·미션·도전으로 극복하는 타워디펜스</p>
        <label for="nickname">닉네임</label>
        <input id="nickname" type="text" maxlength="12" placeholder="12자 이내" autocomplete="off" />
        <p id="gate-error" class="error" hidden></p>
        <button id="btn-enter" class="primary wide">시작</button>

        <!-- 설정 — 시작 전에 켜고 끌 수 있어야 조용한 데서 안 놀란다 -->
        <div id="gate-settings">
          <button id="opt-sound" class="opt" aria-pressed="true">
            <span class="opt-icon">🔊</span>
            <span class="opt-label">사운드</span>
            <span class="opt-state">켜짐</span>
          </button>
          <button id="opt-vibrate" class="opt" aria-pressed="true">
            <span class="opt-icon">📳</span>
            <span class="opt-label">진동</span>
            <span class="opt-state">켜짐</span>
          </button>
          <button id="opt-fullscreen" class="opt">
            <span class="opt-icon">⛶</span>
            <span class="opt-label">전체화면</span>
            <span class="opt-state">끄기</span>
          </button>
        </div>

        <div id="gate-ranking"></div>
      </div>
    </div>

    <!-- 결과 화면 -->
    <div id="result" class="overlay" hidden>
      <div class="dialog">
        <h1 id="result-title">결과</h1>
        <p id="result-sub" class="sub"></p>
        <div id="result-stats"></div>
        <div id="result-ranking"></div>
        <div class="dialog-actions">
          <button id="btn-again" class="primary">다시 하기</button>
          <button id="btn-change-name">닉네임 변경</button>
        </div>
      </div>
    </div>

    <div id="app">
      <!--
        상단 고정 바 — 라이프·골드가 항상 제일 먼저 보여야 한다.
        "다음 웨이브 시작"은 여기 페이즈 칩에 합쳤다. 웨이브마다 누르는 버튼이라
        시트에 넣으면 매번 두 번 탭해야 한다.
      -->
      <header id="topbar">
        <!--
          아이콘은 이모지가 아니라 CSS 로 그린다. 이모지는 기기마다 모양이 달라
          "이게 뭘 뜻하는지" 가 안 읽혔다. 하트는 텍스트 글리프(♥)라 어디서나 같다.
        -->
        <span class="hud-stat life">
          <span class="ico ico-life">♥</span>
          <span class="hud-val"><b id="stat-life">20</b><em>라이프</em></span>
        </span>
        <span class="hud-stat gold">
          <span class="ico ico-gold"></span>
          <span class="hud-val"><b id="stat-gold">60</b><em>골드</em></span>
        </span>
        <span class="hud-stat wave">
          <span class="hud-val"><b id="stat-wave">1</b><em>웨이브</em></span>
        </span>
        <button id="btn-start" class="phase-chip">준비</button>
        <button id="btn-mute" class="mute-chip" aria-label="소리 끄기" title="소리 끄기">🔊</button>
      </header>

      <div id="wave-preview"></div>

      <div id="stage">
        <canvas id="game" width="600" height="600"></canvas>
        <div id="toast" hidden></div>
        <!-- 상위 등급 뽑기 축하 — 진행을 막지 않도록 클릭을 통과시킨다 -->
        <div id="celebrate" hidden></div>
      </div>

      <!-- 시트 여는 줄. 자주 안 쓰는 건 전부 여기 뒤로 보냈다 -->
      <nav id="sheet-tabs">
        <button data-sheet="missions"><span>🎯</span>미션<em id="tab-missions"></em></button>
        <button data-sheet="challenge"><span>⚡</span>도전<em id="tab-challenge"></em></button>
        <button data-sheet="field"><span>🛡</span>필드<em id="tab-field"></em></button>
        <button data-sheet="codex"><span>📖</span>도감</button>
        <button data-sheet="log"><span>📜</span>기록</button>
      </nav>

      <!-- 하단 독 — 항상 보이는 건 뽑기와 보유 유닛뿐 -->
      <div id="dock">
        <button id="btn-draw" class="primary">뽑기 <em>10골드</em></button>
        <div id="bench"></div>
      </div>
    </div>

    <!-- 시트 — 탭으로 올라온다 -->
    <div id="sheet-backdrop" hidden></div>
    <section id="sheet" hidden>
      <div class="sheet-head">
        <h2 id="sheet-title"></h2>
        <button id="sheet-close" aria-label="닫기">✕</button>
      </div>
      <div id="sheet-body"></div>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
